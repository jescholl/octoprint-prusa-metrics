name: Release

# Tags come from the version in pyproject.toml rather than an autotag action.
# The plugin is installed by pinned tag-archive URL, so the tag and the packaged
# version must agree exactly; deriving the tag from the file makes drift
# impossible instead of merely unlikely.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!tests/**'
      - '!.github/**'
      - '!renovate.json'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Read version from pyproject.toml
        id: version
        run: |
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Skip if the tag already exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
          gh release create "${{ steps.version.outputs.tag }}" --generate-notes
