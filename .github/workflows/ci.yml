name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by the Release workflow, so a release is only ever cut from a commit whose tests passed.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      # OctoPrint is a real dependency of the integration tests (not of the
      # plugin itself), so it is installed here rather than in the package.
      - run: pip install -e ".[dev]" "octoprint==1.11.8"
      - run: pytest --cov=octoprint_prusa_metrics --cov-report=xml
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.xml
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: pip install -e ".[dev]"
      - run: bandit -r octoprint_prusa_metrics

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: pip install build
      - run: python -m build
      # Proves the sdist pip will actually install from a tag archive is sane.
      - run: pip install dist/*.whl

  # Workflow lint and a secret scan of the full history: a leaked key in a public repo's history
  # is already exposed, so this one fails loudly.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      ZIZMOR_VERSION: 1.32.0
      ACTIONLINT_PY_VERSION: 1.7.12.25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans every commit, not just the tip
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: actionlint + zizmor (GitHub Actions)
        run: |
          python -m pip install --quiet "zizmor==${ZIZMOR_VERSION}" "actionlint-py==${ACTIONLINT_PY_VERSION}" "shellcheck-py==0.11.0.1"
          actionlint
          zizmor --offline --min-severity low .github/workflows
      - name: gitleaks (full history)
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner
