name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      # OctoPrint is a real dependency of the integration tests (not of the
      # plugin itself), so it is installed here rather than in the package.
      - run: pip install -e ".[dev]" "octoprint==1.11.8"
      - run: pytest --cov=octoprint_prusa_metrics --cov-report=xml
      - uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install -e ".[dev]"
      - run: bandit -r octoprint_prusa_metrics

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install build
      - run: python -m build
      # Proves the sdist pip will actually install from a tag archive is sane.
      - run: pip install dist/*.whl
